<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>First Django Project</title>
</head>
<body>
    <h1>Hello {{name}}!</h1>
    <p>Age:{{age}}!</p>
    <p>course:{{Course}}!</p>

    {% if age >= 18 %}
        <p> You are an adult</p>
    {%else%}
        <p>You are under 18</p>
    {%endif%}

    <h2>My courses</h2>

    <u1>
        {% for course in courses %}
            <li>
                {{forloop.counter}}.{{ course }}
                {%if not forloop.last %} |
                {% endif %}
            </li>
        {% endfor %}
    </u1>

</body>
</html>
