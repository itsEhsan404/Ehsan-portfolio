{% load static %}

<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="{% static 'core/css/style.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    {% block page_css %}{% endblock %}

    <title>
        {% block title %}Ehsan Ghasemi | Portfolio{% endblock %}
    </title>


</head>

<body>

    <nav>
        <div class="container nav-content">

            <div class="logo">
                Ehsan Ghasemi
            </div>

            <ul class="nav-links">
                <a href="{% url 'home' %}">Home</a>
                <a href="{% url 'about' %}">About</a>
                <a href="{% url 'projects' %}">Projects</a>
                <a href="{% url 'blog' %}">Blog</a>
                <a href="{% url 'contact' %}">Contact</a>
            </ul>

        </div>
    </nav>


    <main>
        <div class="container">

            {% block content %}
            {% endblock %}

        </div>
    </main>


    <footer>
        <div class="container footer-content">
            <p>© 2026 Ehsan Ghasemi. All rights reserved.</p>

            <div class="social-links">
                <a href="https://github.com/" target="_blank" rel="noopener noreferrer" aria-label="GitHub" title="GitHub">
                    <i class="fa-brands fa-github" aria-hidden="true"></i>
                </a>
                <a href="https://t.me/" target="_blank" rel="noopener noreferrer" aria-label="Telegram" title="Telegram">
                    <i class="fa-brands fa-telegram" aria-hidden="true"></i>
                </a>
                <a href="https://www.instagram.com/" target="_blank" rel="noopener noreferrer" aria-label="Instagram" title="Instagram">
                    <i class="fa-brands fa-instagram" aria-hidden="true"></i>
                </a>
                <a href="https://www.linkedin.com/" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn" title="LinkedIn">
                    <i class="fa-brands fa-linkedin-in" aria-hidden="true"></i>
                </a>
            </div>
        </div>
    </footer>

</body>
</html>
